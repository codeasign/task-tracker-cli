name: Setup project
description: Checks out dependencies install with npm, caching based on the lockfile.
inputs:
  node-version:
    description: Node.js version to install
    required: true
    default: "20"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Install dependencies
      run: npm install
      shell: bash
